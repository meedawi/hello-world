name: scout-github

on:
  workflow_dispatch:
    inputs:
      min_stars:
        description: Minimum stars for a repo to be considered
        default: "500"
  push:
    branches: [claude/gifted-bardeen-f632ck]
    paths: [scout/gh_scan.py, .github/workflows/scout-github.yml]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Scan GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.SCOUT_TOKEN || secrets.GITHUB_TOKEN }}
          MIN_STARS: ${{ inputs.min_stars || '500' }}
        run: python scout/gh_scan.py
      - name: Commit results
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add data/gh_repos.jsonl data/gh_candidates.csv
          git commit -m "data: GitHub scan results [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
